<!DOCTYPE html>
<html lang="ko">
<head>
 <meta name="apple-mobile-web-app-capable" content="yes">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💬 영어 문장 카드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #f7f8fa;
    min-height: 100vh;
    color: #111;
  }
  input:focus { outline: none; border-color: #10b981 !important; }
  button { font-family: inherit; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #f1f1f1; }
  ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const STORAGE_KEY = "eng_sentence_cards_v2";

const SYSTEM_PROMPT = `You are an English expression coach for Korean speakers.
When given a Korean sentence the user wanted to say in English, respond ONLY with a valid JSON object (no markdown, no backticks, no extra text) in this exact format:
{
  "english": "The natural English sentence",
  "explanation": "한국어로 2-3문장: 왜 이 표현을 쓰는지, 어떤 상황에 적합한지",
  "alternatives": ["similar expression 1", "similar expression 2"],
  "level": "casual"
}
The level field must be one of: casual, neutral, formal.
Make the English natural and conversational, not overly literal.`;

async function translateWithClaude(koreanText) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1000,
      system: SYSTEM_PROMPT,
      messages: [{ role: "user", content: koreanText }],
    }),
  });
  if (!res.ok) throw new Error("API error");
  const data = await res.json();
  const raw = data.content?.find(b => b.type === "text")?.text || "{}";
  return JSON.parse(raw.trim());
}

// ── Storage helpers ────────────────────────────────────────────
function loadCards() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); } catch { return []; }
}
function saveCards(cards) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cards)); } catch {}
}

// ── Level config ───────────────────────────────────────────────
const LEVEL = {
  casual:  { label: "캐주얼",  color: "#d97706", bg: "#fef3c7", border: "#fcd34d" },
  neutral: { label: "일반",    color: "#2563eb", bg: "#eff6ff", border: "#93c5fd" },
  formal:  { label: "격식",    color: "#7c3aed", bg: "#f5f3ff", border: "#c4b5fd" },
};

// ── FlipCard ───────────────────────────────────────────────────
function FlipCard({ card, onDelete }) {
  const [flipped, setFlipped] = useState(false);
  const [mode, setMode] = useState("ko2en");
  const lm = LEVEL[card.level] || LEVEL.neutral;

  return (
    <div style={{ marginBottom: 14 }}>
      {/* top bar */}
      <div style={{ display:"flex", gap:6, marginBottom:5, alignItems:"center" }}>
        {["ko2en","en2ko"].map(m => (
          <button key={m} onClick={() => { setMode(m); setFlipped(false); }} style={{
            fontSize:"0.62rem", padding:"2px 9px", borderRadius:20,
            border: mode===m ? "1.5px solid #111" : "1px solid #ddd",
            background: mode===m ? "#111" : "#fff",
            color: mode===m ? "#fff" : "#aaa",
            cursor:"pointer", fontFamily:"inherit",
          }}>{m==="ko2en" ? "한→영" : "영→한"}</button>
        ))}
        <span style={{
          marginLeft:"auto", fontSize:"0.6rem", padding:"2px 9px", borderRadius:20,
          background: lm.bg, color: lm.color, border:`1px solid ${lm.border}`,
        }}>{lm.label}</span>
        <button onClick={() => onDelete(card.id)} style={{
          background:"none", border:"none", color:"#ccc", cursor:"pointer",
          fontSize:"0.85rem", padding:"0 2px", lineHeight:1,
        }}>✕</button>
      </div>

      {/* card */}
      <div onClick={() => setFlipped(f => !f)} style={{
        background: flipped ? "#f0fdf4" : "#fff",
        border: `1.5px solid ${flipped ? "#86efac" : "#e8eaed"}`,
        borderRadius: 14, padding: "18px 20px",
        cursor: "pointer", minHeight: 82,
        boxShadow: flipped ? "0 4px 18px rgba(16,185,129,0.1)" : "0 1px 3px rgba(0,0,0,0.06)",
        transition: "all 0.18s ease",
      }}>
        {!flipped ? (
          <div>
            <div style={{ fontSize:"1rem", fontWeight:600, color:"#111", lineHeight:1.55 }}>
              {mode==="ko2en" ? card.korean : card.english}
            </div>
            <div style={{ marginTop:8, fontSize:"0.67rem", color:"#c4c4c4" }}>
              탭해서 {mode==="ko2en" ? "영어" : "한국어"} 확인 →
            </div>
          </div>
        ) : (
          <div>
            <div style={{ fontSize:"1.05rem", fontWeight:700, color:"#059669", lineHeight:1.55 }}>
              {mode==="ko2en" ? card.english : card.korean}
            </div>
            {card.explanation && (
              <div style={{
                marginTop:12, padding:"10px 13px",
                background:"#f0fdf4", borderRadius:8,
                fontSize:"0.77rem", color:"#374151", lineHeight:1.7,
              }}>{card.explanation}</div>
            )}
            {card.alternatives?.length > 0 && (
              <div style={{ marginTop:10 }}>
                <div style={{ fontSize:"0.62rem", color:"#9ca3af", marginBottom:5 }}>비슷한 표현</div>
                <div style={{ display:"flex", flexWrap:"wrap", gap:5 }}>
                  {card.alternatives.map((a,i) => (
                    <span key={i} style={{
                      fontSize:"0.75rem", padding:"3px 10px",
                      background:"#ecfdf5", color:"#065f46",
                      border:"1px solid #a7f3d0", borderRadius:20,
                    }}>{a}</span>
                  ))}
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

// ── Study Mode ─────────────────────────────────────────────────
function StudyMode({ cards, onExit }) {
  const [idx, setIdx] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [scores, setScores] = useState({ know:0, unsure:0 });
  const done = idx >= cards.length;

  const card = cards[idx];
  const lm = card ? (LEVEL[card.level] || LEVEL.neutral) : null;
  const progress = cards.length ? (idx / cards.length) * 100 : 0;

  const score = (know) => {
    setScores(s => ({ ...s, [know ? "know" : "unsure"]: s[know ? "know" : "unsure"] + 1 }));
    setIdx(i => i + 1);
    setFlipped(false);
  };

  if (!cards.length) return (
    <div style={{ textAlign:"center", padding:"80px 20px", color:"#aaa" }}>
      <div style={{ fontSize:"2rem", marginBottom:12 }}>📭</div>
      <div>카드가 없어요</div>
      <button onClick={onExit} style={btnS("#111","#fff")}>← 돌아가기</button>
    </div>
  );

  if (done) return (
    <div style={{ textAlign:"center", padding:"80px 20px" }}>
      <div style={{ fontSize:"3rem", marginBottom:16 }}>🎉</div>
      <div style={{ fontSize:"1.3rem", fontWeight:800, marginBottom:8 }}>학습 완료!</div>
      <div style={{ color:"#6b7280", marginBottom:28, fontSize:"0.9rem" }}>
        알겠어요 {scores.know}개 &nbsp;·&nbsp; 헷갈려요 {scores.unsure}개
      </div>
      <button onClick={onExit} style={btnS("#111","#fff")}>← 목록으로</button>
    </div>
  );

  return (
    <div style={{ maxWidth:480, margin:"0 auto", padding:"24px 16px" }}>
      {/* progress */}
      <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:24 }}>
        <button onClick={onExit} style={{ background:"none", border:"none", color:"#9ca3af", cursor:"pointer", fontSize:"1.1rem" }}>←</button>
        <div style={{ flex:1, height:6, background:"#e5e7eb", borderRadius:99 }}>
          <div style={{ width:`${progress}%`, height:"100%", background:"#10b981", borderRadius:99, transition:"width 0.3s" }} />
        </div>
        <div style={{ fontSize:"0.75rem", color:"#9ca3af" }}>{idx+1}/{cards.length}</div>
      </div>

      {/* level badge */}
      <div style={{ display:"flex", justifyContent:"flex-end", marginBottom:12 }}>
        <span style={{
          fontSize:"0.65rem", padding:"3px 10px", borderRadius:20,
          background:lm.bg, color:lm.color, border:`1px solid ${lm.border}`,
        }}>{lm.label}</span>
      </div>

      {/* flip card */}
      <div onClick={() => !flipped && setFlipped(true)} style={{
        background: flipped ? "#f0fdf4" : "#fff",
        border: `2px solid ${flipped ? "#6ee7b7" : "#e5e7eb"}`,
        borderRadius:20, padding:"40px 28px", minHeight:220,
        cursor: flipped ? "default" : "pointer",
        display:"flex", flexDirection:"column", justifyContent:"center",
        boxShadow:"0 4px 24px rgba(0,0,0,0.05)", transition:"all 0.2s",
      }}>
        {!flipped ? (
          <>
            <div style={{ fontSize:"0.7rem", color:"#9ca3af", marginBottom:14 }}>이 문장을 영어로 말하면?</div>
            <div style={{ fontSize:"1.2rem", fontWeight:700, color:"#111", lineHeight:1.6 }}>{card.korean}</div>
            <div style={{ marginTop:24, fontSize:"0.7rem", color:"#d1d5db" }}>탭해서 정답 확인</div>
          </>
        ) : (
          <>
            <div style={{ fontSize:"0.7rem", color:"#059669", marginBottom:12 }}>정답</div>
            <div style={{ fontSize:"1.2rem", fontWeight:700, color:"#065f46", lineHeight:1.6 }}>{card.english}</div>
            {card.explanation && (
              <div style={{
                marginTop:16, borderTop:"1px solid #d1fae5", paddingTop:14,
                fontSize:"0.78rem", color:"#374151", lineHeight:1.7,
              }}>{card.explanation}</div>
            )}
            {card.alternatives?.length > 0 && (
              <div style={{ marginTop:12, display:"flex", flexWrap:"wrap", gap:6 }}>
                {card.alternatives.map((a,i) => (
                  <span key={i} style={{
                    fontSize:"0.75rem", padding:"3px 10px",
                    background:"#ecfdf5", color:"#065f46",
                    border:"1px solid #a7f3d0", borderRadius:20,
                  }}>{a}</span>
                ))}
              </div>
            )}
          </>
        )}
      </div>

      {/* score buttons */}
      {flipped && (
        <div style={{ display:"flex", gap:12, marginTop:16 }}>
          <button onClick={() => score(false)} style={btnS("#fee2e2","#dc2626","1px solid #fca5a5")}>🤔 헷갈려요</button>
          <button onClick={() => score(true)}  style={btnS("#d1fae5","#059669","1px solid #6ee7b7")}>✓ 알겠어요</button>
        </div>
      )}

      <div style={{ marginTop:14, display:"flex", justifyContent:"center", gap:24, fontSize:"0.75rem", color:"#9ca3af" }}>
        <span>✓ 알겠어요 {scores.know}</span>
        <span>? 헷갈려요 {scores.unsure}</span>
      </div>
    </div>
  );
}

function btnS(bg, color, border="none") {
  return {
    flex:1, padding:"13px 0", borderRadius:12, border,
    background:bg, color, fontWeight:700, fontSize:"0.9rem",
    cursor:"pointer", fontFamily:"inherit",
  };
}

// ── Main App ───────────────────────────────────────────────────
function App() {
  const [cards, setCards]   = useState(() => loadCards());
  const [input, setInput]   = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError]   = useState("");
  const [view, setView]     = useState("list");
  const [filter, setFilter] = useState("all");
  const inputRef = useRef(null);

  useEffect(() => { saveCards(cards); }, [cards]);

  const handleAdd = async () => {
    const text = input.trim();
    if (!text || loading) return;
    setLoading(true);
    setError("");
    try {
      const r = await translateWithClaude(text);
      const card = {
        id: Date.now(),
        korean: text,
        english: r.english || "",
        explanation: r.explanation || "",
        alternatives: r.alternatives || [],
        level: r.level || "neutral",
      };
      setCards(prev => [card, ...prev]);
      setInput("");
      inputRef.current?.focus();
    } catch {
      setError("번역 중 오류가 발생했어요. 다시 시도해주세요.");
    }
    setLoading(false);
  };

  const handleDelete = (id) => {
    setCards(prev => prev.filter(c => c.id !== id));
  };

  const filtered = filter === "all" ? cards : cards.filter(c => c.level === filter);

  if (view === "study") return (
    <div style={{ minHeight:"100vh", background:"#f7f8fa" }}>
      <StudyMode cards={filtered} onExit={() => setView("list")} />
    </div>
  );

  return (
    <div style={{ minHeight:"100vh", background:"#f7f8fa", paddingBottom:80 }}>

      {/* ── Header ── */}
      <div style={{
        background:"#fff", borderBottom:"1px solid #f0f0f0",
        padding:"20px 20px 16px",
        position:"sticky", top:0, zIndex:10,
        boxShadow:"0 1px 8px rgba(0,0,0,0.04)",
      }}>
        <div style={{ maxWidth:540, margin:"0 auto" }}>
          <div style={{ display:"flex", alignItems:"baseline", gap:8, marginBottom:14 }}>
            <div style={{ fontSize:"1.2rem", fontWeight:800 }}>💬 영어 문장 카드</div>
            <div style={{ fontSize:"0.7rem", color:"#9ca3af" }}>{cards.length}개 저장됨</div>
          </div>

          {/* input row */}
          <div style={{ display:"flex", gap:8 }}>
            <input
              ref={inputRef}
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={e => e.key === "Enter" && handleAdd()}
              placeholder="말하고 싶었던 한국어 문장을 입력하세요"
              disabled={loading}
              style={{
                flex:1, padding:"12px 16px", borderRadius:12,
                border:"1.5px solid #e5e7eb", fontSize:"0.9rem",
                background: loading ? "#fafafa" : "#fff",
                transition:"border-color 0.15s", fontFamily:"inherit",
              }}
            />
            <button
              onClick={handleAdd}
              disabled={loading || !input.trim()}
              style={{
                padding:"12px 20px", borderRadius:12, border:"none",
                background: loading || !input.trim() ? "#e5e7eb" : "#111",
                color: loading || !input.trim() ? "#9ca3af" : "#fff",
                fontWeight:700, fontSize:"0.9rem",
                cursor: loading ? "wait" : "pointer",
                whiteSpace:"nowrap", fontFamily:"inherit",
                transition:"all 0.15s",
              }}
            >{loading ? "번역 중…" : "추가"}</button>
          </div>

          {error && (
            <div style={{ marginTop:8, fontSize:"0.77rem", color:"#ef4444" }}>{error}</div>
          )}

          {loading && (
            <div style={{ marginTop:8, fontSize:"0.77rem", color:"#10b981" }}>
              ✦ Claude가 번역하고 있어요…
            </div>
          )}
        </div>
      </div>

      {/* ── Filter + Study button ── */}
      <div style={{ maxWidth:540, margin:"16px auto 0", padding:"0 16px" }}>
        <div style={{ display:"flex", gap:7, alignItems:"center", flexWrap:"wrap" }}>
          {[
            { key:"all",    label:"전체",   lm:{ color:"#374151", bg:"#f3f4f6", border:"#d1d5db" } },
            { key:"casual", label:"캐주얼", lm:LEVEL.casual },
            { key:"neutral",label:"일반",   lm:LEVEL.neutral },
            { key:"formal", label:"격식",   lm:LEVEL.formal },
          ].map(({ key, label, lm }) => {
            const count = key==="all" ? cards.length : cards.filter(c=>c.level===key).length;
            const active = filter === key;
            return (
              <button key={key} onClick={() => setFilter(key)} style={{
                fontSize:"0.68rem", padding:"4px 12px", borderRadius:20,
                border: active ? `1.5px solid ${lm.color}` : `1px solid ${lm.border||"#e5e7eb"}`,
                background: active ? lm.bg : "#fff",
                color: active ? lm.color : "#9ca3af",
                fontWeight: active ? 700 : 400,
                cursor:"pointer", fontFamily:"inherit",
              }}>{label} {count}</button>
            );
          })}
          {filtered.length > 0 && (
            <button onClick={() => setView("study")} style={{
              marginLeft:"auto", fontSize:"0.78rem", padding:"6px 16px", borderRadius:20,
              border:"none", background:"#111", color:"#fff",
              cursor:"pointer", fontWeight:700, fontFamily:"inherit",
            }}>학습 시작 →</button>
          )}
        </div>
      </div>

      {/* ── Card list ── */}
      <div style={{ maxWidth:540, margin:"16px auto 0", padding:"0 16px" }}>
        {filtered.length === 0 ? (
          <div style={{ textAlign:"center", padding:"80px 0", color:"#d1d5db" }}>
            <div style={{ fontSize:"2.5rem", marginBottom:14 }}>💬</div>
            <div style={{ fontSize:"0.9rem" }}>
              {cards.length === 0
                ? "위에 한국어 문장을 입력하면 영어 카드가 만들어져요"
                : "이 레벨의 카드가 없어요"}
            </div>
          </div>
        ) : (
          filtered.map(card => (
            <FlipCard key={card.id} card={card} onDelete={handleDelete} />
          ))
        )}
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
